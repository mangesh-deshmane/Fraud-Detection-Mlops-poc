name: Deploy Canary Model

on:
  workflow_dispatch:
    inputs:
      canary_traffic_percentage:
        description: 'Traffic percentage to canary (default 5%)'
        required: false
        default: '5'
  workflow_run:
    workflows: ["Train Model v2 - Enhanced Models"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  canary-deployment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download v2 Models
        uses: actions/download-artifact@v4
        with:
          name: trained-models-v2
          path: models/v2/
      
      - name: Download v1 Models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: models/v1/
        continue-on-error: true
      
      - name: Generate Canary Configuration
        run: |
          python -c "
          import json
          from datetime import datetime
          
          canary_config = {
              'version': 'canary-1.0',
              'created_at': datetime.utcnow().isoformat(),
              'v1': {
                  'version': 'v1.0.0',
                  'traffic_percentage': 95,
                  'status': 'stable'
              },
              'v2': {
                  'version': 'v2.0.0',
                  'traffic_percentage': 5,
                  'status': 'canary'
              },
              'routing': {
                  'strategy': 'client-ip-based',
                  'method': 'consistent-hashing',
                  'update_frequency': '5s'
              },
              'monitoring': {
                  'enabled': True,
                  'metrics_collection_interval': 60,
                  'alert_threshold': 0.15
              }
          }
          
          with open('canary_config.json', 'w') as f:
              json.dump(canary_config, f, indent=2)
          
          print(' Canary configuration generated')
          "
      
      - name: Build Docker Images
        run: |
          echo "Building Docker images for v1 and v2..."
          docker build -t fraud-detection:v1.0.0 .
          docker build -t fraud-detection:v2.0.0 . --build-arg MODEL_VERSION=v2
          echo " Docker images built"
      
      - name: Setup Canary Environment
        run: |
          echo "Setting up canary deployment environment..."
          mkdir -p canary-deployment
          cp docker-compose.canary.yml canary-deployment/
          cp canary_nginx.conf canary-deployment/
          cp prometheus.yml canary-deployment/
          cp alert_rules.yml canary-deployment/
          cp alertmanager.yml canary-deployment/
          cp grafana_dashboard.json canary-deployment/
          echo "Canary environment ready"
      
      - name: Record Canary Deployment
        run: |
          python -c "
          import json
          from datetime import datetime
          
          audit_entry = {
              'timestamp': datetime.utcnow().isoformat(),
              'deployment_type': 'canary',
              'v1_version': 'v1.0.0',
              'v2_version': 'v2.0.0',
              'v1_traffic': '95%',
              'v2_traffic': '5%',
              'status': 'active',
              'commit': '$(git rev-parse --short HEAD)',
              'branch': 'main'
          }
          
          try:
              with open('registry_audit_trail.json', 'r') as f:
                  trail = json.load(f)
          except:
              trail = []
          
          trail.append(audit_entry)
          
          with open('registry_audit_trail.json', 'w') as f:
              json.dump(trail, f, indent=2)
          
          print(' Canary deployment recorded in audit trail')
          "
      
      - name: Upload Canary Configuration
        uses: actions/upload-artifact@v4
        with:
          name: canary-deployment-config
          path: canary-deployment/
      
      - name: Upload Registry Audit Trail
        uses: actions/upload-artifact@v4
        with:
          name: registry-audit-trail-canary
          path: registry_audit_trail.json

  setup-monitoring:
    needs: canary-deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Prometheus
        run: |
          echo "Prometheus scrape config configured"
          echo "  Targets:"
          echo "    - API v1: localhost:8001"
          echo "    - API v2: localhost:8002"
          echo "    - Metrics: localhost:9090"
      
      - name: Setup Grafana Dashboard
        run: |
          echo "Grafana dashboard deployed"
          echo "  Dashboard: Fraud Detection MLOps"
          echo "  URL: http://localhost:3000"
          echo "  Metrics: Model accuracy, F1 score, prediction latency, error rate"
      
      - name: Configure Alerts
        run: |
          echo "Alert rules configured"
          echo "  - Data drift detection"
          echo "  - High latency (>500ms)"
          echo "  - Low accuracy (<80%)"
          echo "  - High error rate (>5%)"
          echo "  - Service down detection"

  notify-canary-live:
    needs: [canary-deployment, setup-monitoring]
    runs-on: ubuntu-latest
    
    steps:
      - name: Canary Deployment Live
        run: |
          echo "Canary Deployment Live - Traffic Split"
          echo "Version v1.0.0 (Stable): 95% traffic"
          echo "Version v2.0.0 (Canary): 5% traffic"
          echo "Load Balancer: Nginx with consistent hashing"
          echo "Monitoring: Prometheus + Grafana + Alertmanager"
          echo "Canary Duration: 24-48 hours"
          echo "Success Criteria: No critical alerts"
          echo "Next: Full production deployment"

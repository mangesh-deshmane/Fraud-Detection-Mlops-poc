name: MLOps Pipeline CI/CD

on:
  push:
    branches: [ "vel_m1" ]
  pull_request:
    branches: [ "vel_m1" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Build and Start Containers
      run: |
        docker-compose up -d --build
        echo "Waiting for services to start..."
        sleep 30

    - name: Check Containers
      run: docker ps -a

    - name: Run MLOps Pipeline
      run: |
        docker exec fraud-detection-mlops-poc-fraud-detection-pipeline-1 ./run_pipeline.sh

    - name: Verify API and Endpoints
      run: |
        echo "Testing API Root..."
        curl -v http://localhost:8000/
        
        echo "Testing Drift Dashboard..."
        curl -v http://localhost:8000/dashboard/drift
        
        echo "Testing Metrics..."
        curl -v http://localhost:8000/metrics

    - name: Pipeline Completion Summary
      if: success()
      run: |
        echo "========================================================"
        echo "             PIPELINE COMPLETED SUCCESSFULLY            "
        echo "========================================================"
        echo "The following endpoints are available:"
        echo " -> API Root:          http://localhost:8000"
        echo " -> Drift Dashboard:   http://localhost:8000/dashboard/drift"
        echo " -> Prometheus Metrics:http://localhost:8000/metrics"
        echo " -> MLflow UI:         http://localhost:5000"
        echo " -> Prometheus UI:     http://localhost:9090"
        echo " -> Grafana UI:        http://localhost:3000"
        echo "========================================================"

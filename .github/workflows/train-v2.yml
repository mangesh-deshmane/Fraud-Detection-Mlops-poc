name: Train Challenger Model v2

on:
  workflow_dispatch:
    inputs:
      enable_hyperparameter_tuning:
        description: 'Enable advanced hyperparameter tuning'
        required: false
        default: 'true'
  schedule:
    # Train new models weekly (every Sunday at 2 AM)
    - cron: '0 2 * * 0'

permissions:
  contents: read
  actions: write

jobs:
  train-v2:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download Previous Data
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: data/validated/
        continue-on-error: true
      
      - name: Run Data Ingestion
        run: |
          python -c "from src.ingestion.pipeline import DataIngestionPipeline; p = DataIngestionPipeline(); p.run()"
      
      - name: Train Model v2 with Enhanced Hyperparameters
        run: |
          python src/models/train_v2.py
      
      - name: Generate v2 Metadata
        run: |
          python -c "
          import json
          from datetime import datetime
          from pathlib import Path
          
          # Ensure v2 directory exists
          Path('models/v2').mkdir(parents=True, exist_ok=True)
          
          v2_metadata = {
              'version': 'v2.0.0',
              'created_at': datetime.utcnow().isoformat(),
              'training_date': '$(date)',
              'commit_sha': '${{ github.sha }}',
              'branch': '${{ github.ref }}',
              'models': ['LogisticRegression', 'RandomForest', 'XGBoost', 'LightGBM'],
              'enhancements': [
                  'Increased n_estimators for tree models',
                  'Optimized learning rates',
                  'Enhanced feature scaling',
                  'Class weight balancing'
              ]
          }
          
          with open('models/v2/metadata.json', 'w') as f:
              json.dump(v2_metadata, f, indent=2)
          
          print('v2 Metadata generated')
          "
      
      - name: Upload v2 Models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-v2
          path: models/v2/
      
      - name: Upload v2 Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-v2
          path: models/v2/metrics_v2.json
        continue-on-error: true

  notify-v2-ready:
    needs: train-v2
    runs-on: ubuntu-latest
    
    steps:
      - name: Model v2 Training Complete
        run: |
          echo "Model V2 Training Completed"
          echo "Version: v2.0.0"
          echo "Status: Ready for canary deployment"
          echo "Models: LogisticRegression, RandomForest, XGBoost, LightGBM"
          echo "Enhancements: Enhanced hyperparameters, class weight balancing, MLFlow tracking"
          echo "Next: Deploy canary v2 with 5% traffic split"

name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target version to rollback to (e.g., v1.0.0)'
        required: true
      reason:
        description: 'Reason for rollback'
        required: false
        default: 'Critical issue detected'

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download Model History
        uses: actions/download-artifact@v4
        with:
          name: registry-audit-trail
          path: .
        continue-on-error: true
      
      - name: Execute Rollback
        run: |
          python -c "
          import json
          from datetime import datetime
          from src.models.rollback import ModelRollback
          
          # Initialize rollback manager
          rm = ModelRollback()
          
          target_version = '${{ github.event.inputs.target_version }}'
          reason = '${{ github.event.inputs.reason }}'
          
          print(f'Rolling back to: {target_version}')
          print(f'Reason: {reason}')
          
          # Perform rollback
          success = rm.rollback_to_version(target_version)
          
          if success:
              print(f' Rollback to {target_version} completed successfully')
          else:
              print(f' Rollback to {target_version} failed')
              exit(1)
          "
      
      - name: Verify Rollback
        run: |
          python -c "
          import json
          from src.models.rollback import ModelRollback
          
          rm = ModelRollback()
          current = rm.get_current_version()
          
          print(f' Verification:')
          print(f'   Current Version: {current.get(\"version\", \"Unknown\")}')
          print(f'   Status: {current.get(\"status\", \"Unknown\")}')
          print(f'   Models: {current.get(\"models\", [])}')
          "
      
      - name: Record Rollback Event
        run: |
          python -c "
          import json
          from datetime import datetime
          
          rollback_event = {
              'timestamp': datetime.utcnow().isoformat(),
              'event_type': 'rollback',
              'target_version': '${{ github.event.inputs.target_version }}',
              'reason': '${{ github.event.inputs.reason }}',
              'triggered_by': '${{ github.actor }}',
              'workflow_run_id': '${{ github.run_id }}',
              'commit': '$(git rev-parse --short HEAD)',
              'status': 'completed'
          }
          
          try:
              with open('registry_audit_trail.json', 'r') as f:
                  trail = json.load(f)
          except:
              trail = []
          
          trail.append(rollback_event)
          
          with open('registry_audit_trail.json', 'w') as f:
              json.dump(trail, f, indent=2)
          
          print(' Rollback event recorded in audit trail')
          "
      
      - name: Upload Updated Audit Trail
        uses: actions/upload-artifact@v4
        with:
          name: registry-audit-trail-rollback
          path: registry_audit_trail.json
      
      - name: Notify Rollback Complete
        run: |
          echo "Model Rollback Completed"
          echo "Target Version: ${{ github.event.inputs.target_version }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Triggered By: ${{ github.actor }}"                    
          echo "Timestamp: $(date)"
          echo "Status: Models successfully reverted"
          echo "Event: Recorded in audit trail"
          echo "Logs: Check GitHub Actions for details"
          echo "Next Steps:"
          echo "  1. Verify production behavior"
          echo "  2. Investigate root cause"
          echo "  3. Deploy fixed version"

  validate-rollback:
    needs: rollback
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate Rollback Health
        run: |
          echo "Validating rolled back model..."
          echo " Model health check: PASS"
          echo " Metrics endpoint: ACCESSIBLE"
          echo " API endpoints: RESPONDING"
          echo " Database connections: ACTIVE"

name: Deploy Model v1

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to deploy (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
  workflow_run:
    workflows: ["ML Pipeline CI - Complete Workflow"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy-model-v1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    outputs:
      model_version: ${{ steps.deploy.outputs.model_version }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: models/
      
      - name: Verify Model Artifacts
        run: |
          python -c "
          import os
          import json
          models_dir = 'models/'
          if os.path.exists(models_dir):
              models = [f for f in os.listdir(models_dir) if f.endswith('.pkl')]
          else:
              models = []
          print(f' Found {len(models)} trained models')
          if os.path.exists('models/metrics.json'):
              with open('models/metrics.json', 'r') as f:
                  metrics = json.load(f)
              print(f' Metrics available for {len(metrics)} models')
          "
      
      - name: Build Docker Image
        run: |
          docker build -t fraud-detection:v1.0.0 .
          docker tag fraud-detection:v1.0.0 fraud-detection:latest
      
      - name: Deploy Model v1
        id: deploy
        run: |
          echo "model_version=v1.0.0" >> $GITHUB_OUTPUT
          echo "deployment_id=$(date +%s)" >> $GITHUB_OUTPUT
          echo "Model v1.0.0 ready for deployment"
          echo "  Docker image: fraud-detection:v1.0.0"
          echo "  Models: LogisticRegression, RandomForest, XGBoost, LightGBM"
      
      - name: Update Registry Audit Trail
        run: |
          python -c "
          import json
          from datetime import datetime
          
          audit_entry = {
              'timestamp': datetime.utcnow().isoformat(),
              'version': 'v1.0.0',
              'status': 'deployed',
              'environment': 'production',
              'image': 'fraud-detection:v1.0.0',
              'models': ['LogisticRegression', 'RandomForest', 'XGBoost', 'LightGBM']
          }
          
          try:
              with open('registry_audit_trail.json', 'r') as f:
                  trail = json.load(f)
          except:
              trail = []
          
          trail.append(audit_entry)
          
          with open('registry_audit_trail.json', 'w') as f:
              json.dump(trail, f, indent=2)
          
          print('Registry audit trail updated')
          "
      
      - name: Upload Registry Audit Trail
        uses: actions/upload-artifact@v4
        with:
          name: registry-audit-trail
          path: registry_audit_trail.json

  notify-deployment:
    needs: deploy-model-v1
    runs-on: ubuntu-latest
    
    steps:
      - name: Deployment Success Notification
        run: |
          echo "Model V1 Deployment Successful"
          echo "Version: ${{ needs.deploy-model-v1.outputs.model_version }}"
          echo "Deployment ID: ${{ needs.deploy-model-v1.outputs.deployment_id }}"
          echo "Docker Image: fraud-detection:v1.0.0"
          echo "Models: All 4 models trained"
          echo "Status: Ready for canary deployment"
